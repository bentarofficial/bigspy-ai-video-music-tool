<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor – Music Video Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link id="gfonts" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Roboto:wght@400;700;900&family=Open+Sans:wght@400;700;800&family=Nunito:wght@400;700;900&family=Lexend:wght@400;700;900&family=Josefin+Sans:wght@400;700&family=Quicksand:wght@400;700&family=Comfortaa:wght@400;700&family=Oswald:wght@400;700&family=Anton:wght@400&family=Baloo+2:wght@400;800&family=Playfair+Display:wght@400;700;900&family=Merriweather:wght@400;700;900&family=Noto+Serif:wght@400;700&family=Lobster:wght@400&family=Pacifico:wght@400&family=Dancing+Script:wght@400;700&family=Great+Vibes:wght@400&family=Charm:wght@400;700&family=Pattaya:wght@400&family=Patrick+Hand:wght@400&family=Sigmar:wght@400&display=block" rel="stylesheet">
<link rel="stylesheet" href="/editor-assets/editor.css">
</head>
<body>
<header class="top">
  <a class="ib" href="/" title="Về trang chính">←</a>
  <div class="logo">🎬</div>
  <input id="ptitle" class="ptitle" spellcheck="false">
  <span id="saved" class="saved">Đã lưu</span>
  <div class="grow"></div>
  <button class="ib" id="undo" title="Hoàn tác (Ctrl+Z)">↶</button>
  <button class="ib" id="redo" title="Làm lại (Ctrl+Y)">↷</button>
  <button class="ib" id="help" title="Phím tắt">⌨</button>
  <button class="primary" id="export">⬆ Xuất video</button>
</header>

<main class="work">
  <!-- thư viện -->
  <section class="lib panel" id="paneL">
    <button class="collapse" data-col="l" title="Thu gọn / mở rộng">«</button>
    <nav class="tabs">
      <button data-tab="media" class="on" title="Media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Media</span></button>
      <button data-tab="text" title="Chữ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span>Chữ</span></button>
      <button data-tab="trans" title="Chuyển cảnh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="8" height="10" rx="1.5"/><rect x="14" y="7" width="8" height="10" rx="1.5"/><path d="m10.5 12h3"/></svg><span>Chuyển cảnh</span></button>
    </nav>
    <div class="tabbody" data-body="media">
      <label class="drop" id="drop">
        <input type="file" id="file" multiple accept="video/*,image/*,audio/*" hidden>
        <b>＋ Nhập media</b><small>Kéo thả video, ảnh, nhạc vào đây</small>
      </label>
      <div class="mgrid" id="mgrid"></div>
    </div>
    <div class="tabbody" data-body="text" hidden>
      <div class="tpresets" id="tpresets"></div>
    </div>
    <div class="tabbody" data-body="trans" hidden>
      <p class="hint">Nhấp để áp dụng cho clip đang chọn, hoặc kéo thả vào chỗ nối giữa 2 clip (nút ◆ trên timeline).</p>
      <div class="row"><label>Thời lượng</label><div class="ctl"><input type="range" id="trDur" min="0.1" max="2" step="0.1" value="0.5"><span id="trDurLb">0.5s</span></div></div>
      <div class="trgrid" id="trgrid"></div>
      <div class="btnrow"><button class="ghost" id="trAll">Áp dụng cho tất cả chỗ nối</button><button class="ghost" id="trRand">🎲 Ngẫu nhiên</button><button class="ghost" id="trRandSmooth">Ngẫu nhiên kiểu mượt</button><button class="ghost" id="trUpgrade">Đổi chuyển cảnh cũ sang mượt</button><button class="ghost danger" id="trNone">Bỏ hết</button></div>
    </div>
  </section>

  <div class="vsplit" data-side="l" title="Kéo để đổi độ rộng · nhấp đúp để về mặc định"></div>
  <!-- xem trước -->
  <section class="viewer panel">
    <div class="stage" id="stage"><div id="player" class="player"></div><div class="ovl" id="ovl"></div></div>
    <div class="transport">
      <span class="tc" id="tc">00:00.00</span>
      <div class="grow"></div>
      <button class="ib" id="toStart" title="Về đầu (Home)">⏮</button>
      <button class="ib" id="back1" title="Lùi 1 khung (←)">◀</button>
      <button class="play" id="play" title="Phát / dừng (Space)">▶</button>
      <button class="ib" id="fwd1" title="Tới 1 khung (→)">▶</button>
      <button class="ib" id="toEnd" title="Về cuối (End)">⏭</button>
      <div class="grow"></div>
      <span class="tc dim" id="total">00:00.00</span>
      <button class="ib" id="safe" title="Vùng an toàn TikTok/Reels">▣</button>
    </div>
  </section>

  <div class="vsplit" data-side="r" title="Kéo để đổi độ rộng · nhấp đúp để về mặc định"></div>
  <!-- thuộc tính -->
  <section class="props panel" id="paneR"><button class="collapse" data-col="r" title="Thu gọn / mở rộng">»</button>
    <nav class="rtabs"><button data-rtab="props" class="on" title="Thuộc tính"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Thuộc tính</span></button><button data-rtab="style" title="Phụ đề"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 14h4M13 14h4M7 10h10"/></svg><span>Phụ đề</span></button><button data-rtab="audio" title="Âm lượng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg><span>Âm lượng</span></button><button data-rtab="canvas" title="Khung hình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v14h14M3 7h14v14"/></svg><span>Khung hình</span></button><button data-rtab="filter" title="Bộ lọc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg><span>Bộ lọc</span></button><button data-rtab="ai" title="Sửa bằng AI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>AI</span></button></nav>
    <div id="props"></div>
    <div class="rbody" data-rbody="style" hidden></div><div class="rbody" data-rbody="audio" hidden></div><div class="rbody" data-rbody="canvas" hidden></div><div class="rbody" data-rbody="filter" hidden></div><div class="rbody" data-rbody="ai" hidden></div>
  </section>
</main>

<div class="hsplit" id="hsplit"></div>

<!-- timeline -->
<section class="tlwrap">
  <div class="tltools">
    <button class="ib" id="split" title="Tách khối tại đầu phát (S / Ctrl+B) – với câu lời: chia chữ theo giờ hát"><i class="tic" style="color:#f87171">✂</i> Tách</button>
    <button class="ib" id="del" title="Xoá (Delete)"><i class="tic" style="color:#fb7185">✕</i> Xoá</button>
    <button class="ib" id="dup" title="Nhân bản (Ctrl+D)"><i class="tic" style="color:#60a5fa">⧉</i></button>
    <button class="ib" id="tbGroup" title="Nhóm các khối đang chọn (Ctrl+G) – Ctrl/Shift + nhấp để chọn nhiều"><i class="tic" style="color:#34d399">⌁</i> Nhóm</button>
    <button class="ib" id="tbUngroup" title="Bỏ nhóm (Ctrl+Shift+G)"><i class="tic" style="color:#fbbf24">⛓</i> Bỏ nhóm</button>
    <span class="sep"></span>
    <button class="ib" id="tbAlignScenes" title="Dời các điểm chuyển cảnh của Video chính ra khoảng nghỉ giữa hai câu hát – không còn chuyển cảnh khi đang hát dở câu"><i class="tic" style="color:#f472b6">⇹</i> Căn cảnh theo câu</button>
    <button class="ib" id="tbAddLyric" title="Thêm câu lời tại đầu phát"><i class="tic" style="color:#c084fc">＋</i> Câu lời</button>
    <button class="ib" id="tbAddCover" title="Khung làm mờ để che phụ đề / logo có sẵn trong clip"><i class="tic" style="color:#38bdf8">＋</i> Lớp che mờ</button>
    <button class="ib" id="tbAddText" title="Chữ / tiêu đề tự nhập"><i class="tic" style="color:#facc15">＋</i> Chữ</button>
    <span class="sep"></span>
    <button class="ib on" id="snap" title="Hút dính (N)"><i class="tic" style="color:#f43f5e">⊣</i></button>
    <button class="ib" id="ripple" title="Xoá tự dồn: xoá clip thì các clip phía sau cùng track lùi lại lấp chỗ trống"><i class="tic" style="color:#2dd4bf">⇤</i> Dồn</button>
    <span class="sep"></span>
    <button class="ib" id="detach" title="Tách âm thanh khỏi video"><i class="tic" style="color:#a78bfa">♪⇣</i> Tách âm</button>
    <div class="grow"></div>
    <button class="ib" id="addtrack" title="Thêm track"><i class="tic" style="color:#4ade80">＋</i> Track</button>
    <span class="sep"></span>
    <button class="ib" id="zout" title="Thu nhỏ (-)">－</button>
    <input type="range" id="zoom" min="0" max="100" value="40">
    <button class="ib" id="zin" title="Phóng to (+)">＋</button>
    <button class="ib" id="zfit" title="Vừa khung">⤢</button>
  </div>
  <div class="tl" id="tl">
    <div class="heads" id="heads"></div>
    <div class="scroller" id="scroller">
      <div class="canvas" id="canvas">
        <div class="ruler" id="ruler"></div>
        <div class="lanes" id="lanes"></div>
        <div class="snapline" id="snapline" hidden></div>
        <div class="playhead" id="playhead"><i></i></div>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="/editor-assets/player.js"></script>
<script src="/editor-assets/editor.js"></script>
</body>
</html>
